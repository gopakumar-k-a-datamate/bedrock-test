version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bedrock-postgres-demo
    environment:
      POSTGRES_DB: bedrock_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
