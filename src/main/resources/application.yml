spring:
  application:
    name: bedrock
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5431/bedrock_demo
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # for dev only
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081