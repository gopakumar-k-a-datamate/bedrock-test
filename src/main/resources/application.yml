spring:
  main:
    allow-bean-definition-overriding: true
  mail:
    host: localhost
    port: 1025
    username: null
    password: null
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  application:
    name: bedrock
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5431/bedrock_demo
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # for dev only
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        org.hibernate.envers.audit_table_suffix: _AUD
        org.hibernate.envers.default_schema: audit
    database-platform: org.hibernate.dialect.PostgreSQLDialect
bedrock:
  auditing:
    flow:
      async-enabled: false
    entity:
      enabled: true
      strategy: envers
  security:
    authorization:
      public-paths:
        - "/api/audit/**"
server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.datamate.bedrock: DEBUG